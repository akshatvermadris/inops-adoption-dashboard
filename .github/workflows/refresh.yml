name: Refresh dashboard

# Every day 09:00 IST (03:30 UTC), plus a manual "Run workflow" button.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pull from iNOPS (read-only)
        env:
          INOPS_TOKEN: ${{ secrets.INOPS_TOKEN }}
        run: node pull.js
      - name: Aggregate and build
        run: |
          node aggregate.js
          node build.js
      - name: Check the page does not contain the key
        env:
          INOPS_TOKEN: ${{ secrets.INOPS_TOKEN }}
        run: |
          KEY="${INOPS_TOKEN%%:*}"; SECRET="${INOPS_TOKEN##*:}"
          if grep -q -e "$KEY" -e "$SECRET" site/index.html; then echo "API key found in page, not publishing"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
