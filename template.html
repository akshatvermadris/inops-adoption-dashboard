<title>iNOPS Adoption Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: mGrant platform dashboard — white top bar, grouped left nav, title + underline tabs, labelled filter strip, sectioned card grid, drill-down drawers. Light only by request. */
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f24; --muted:#5d6572; --line:#e4e7ec; --soft:#f1f3f6;
  --nav:#232f3e; --brand:#e8821a; --accent:#146eb4; --accent-soft:#e8f1fa;
  --good:#1f7a3f; --good-soft:#e7f4ec; --warn:#a85a00; --warn-soft:#fdf1e3; --bad:#b42318; --bad-soft:#fdecea;
  --idle:#6b7280; --idle-soft:#eef0f3; --plum:#6b3fa0; --plum-soft:#f1ebf8;
  --font:"Inter","Segoe UI",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.5 var(--font);margin:0;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #9cc3e6;outline-offset:1px}
input:focus,select:focus,input:focus-visible,select:focus-visible{outline:none;border-color:#9cc3e6!important;box-shadow:0 0 0 3px #eef5fb}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.brand{display:flex;align-items:center;gap:14px;white-space:nowrap;min-width:0}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-size:20px;font-weight:700;letter-spacing:-.015em;color:var(--nav)}
.wm b span{color:var(--brand)}
.wm i{display:block;width:48px;height:3px;border-radius:0 0 8px 8px;background:var(--brand);margin-top:3px;transform:skewX(-20deg)}
.wm img{height:30px;display:block}
/* the page is light-only: never let a viewer's dark theme paint form controls */
input,select,textarea,option{background:#ffffff;color:var(--ink);color-scheme:light}
input::placeholder{color:#8a919c}
.brand .vr{width:1px;height:26px;background:var(--line)}
.mg{font-weight:700;font-size:16px;color:#a3195b;letter-spacing:-.01em;line-height:1.1}
.mg small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.02em}
.top .sp{flex:1}
.asat{font-size:13px;color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.asat b{color:var(--ink);font-weight:600}
.tl{border:0;background:none;color:#4a515c;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:6px 6px;border-radius:6px;white-space:nowrap}
.tl:hover{color:var(--ink);background:var(--soft)}
.tl svg,.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.top .bar{width:1px;height:22px;background:var(--line)}
.btn{border:1px solid #cfd5dd;background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:wait}
.menu-btn{display:none}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 57px);background:linear-gradient(to right,var(--card) 231px,var(--line) 231px,var(--line) 232px,transparent 232px)}
nav.side{background:var(--card);padding:14px 10px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
nav.side .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8a919c;padding:10px 12px 8px}
nav.side .grp:not(:first-child){margin-top:14px}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#353b44;text-decoration:none;font-size:14px;margin-bottom:2px}
nav.side a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
nav.side a:hover{background:var(--soft)}
nav.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side a .tag{margin-left:auto;font-size:10px;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
main{min-width:0;padding-block:0 40px}
.head{background:var(--card);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 0}
.head h1{margin:4px 0 2px;font-size:24px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.head p{margin:0 0 6px;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;border-bottom:1px solid var(--line);margin-top:8px}
.tabs a{padding:10px 16px;border-bottom:2px solid transparent;color:#4a515c;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line)}
.fl{display:flex;align-items:center;gap:6px;border:1px solid #d5dae1;border-radius:8px;padding:3px 6px 3px 12px;background:var(--card)}
.fl.set{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.fl.set label{color:var(--accent)}
.fl label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;white-space:nowrap}
.fl select,.fl input{border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;padding:4px;color:var(--ink);max-width:230px;min-width:0}
.chips{display:flex;border:1px solid #d5dae1;border-radius:8px;overflow:hidden}
.chips button{border:0;background:var(--card);padding:6px 11px;font-size:13px;cursor:pointer;border-right:1px solid var(--line)}
.chips button:last-child{border-right:0}
.chips button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.scope{margin-left:auto;font-size:13px;color:var(--muted)}
.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;display:grid;gap:18px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
.sec h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.sec span{font-size:13px;color:var(--muted)}

/* cards */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.span2{grid-column:span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.card .sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;min-width:0;position:relative;box-shadow:0 1px 2px rgba(16,24,40,.04);display:flex;flex-direction:column}
a.kpi{text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
a.kpi:hover{border-color:#b9c4d2;box-shadow:0 3px 10px rgba(16,24,40,.07)}
.kpi .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;margin-bottom:14px;background:var(--accent-soft);color:var(--accent);order:1}
.kpi .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.ic.t-green{background:#e5f4ea;color:#1f7a3f}.ic.t-amber{background:#fdf0dc;color:#b06000}.ic.t-red{background:#fde8e6;color:#b42318}
.ic.t-purple{background:#efe8f8;color:#6b3fa0}.ic.t-teal{background:#e1f4f4;color:#16767a}.ic.t-grey{background:#eef0f3;color:#6b7280}
.kpi .val{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em;order:2}
.kpi .val small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .lbl{font-size:14px;color:#3d434c;font-weight:500;padding-right:22px;order:3;margin-top:6px}
.kpi .foot{font-size:13px;color:var(--muted);margin-top:2px;order:4}
.kpi .progress{order:5}
.kpi .info{position:absolute;top:16px;right:16px}
.delta{font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.progress{height:6px;background:var(--soft);border-radius:4px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.info{border:1px solid #cfd5dd;background:var(--card);border-radius:50%;width:18px;height:18px;font-size:11px;line-height:16px;text-align:center;color:var(--muted);cursor:pointer;padding:0;flex:none;font-family:Georgia,serif;font-style:italic}
.info:hover{border-color:var(--accent);color:var(--accent)}

/* bar list */
.bl{display:grid;gap:9px}
.bl .row{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.bl .row .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl .row .t{height:14px;background:var(--soft);border-radius:4px;overflow:hidden;display:flex}
.bl .row .t i{display:block;height:100%}
.bl .row .v{font-variant-numeric:tabular-nums;text-align:right;min-width:62px;font-weight:500}
.bl .row.click{cursor:pointer}
.bl .row.click:hover .l{color:var(--accent);text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}

/* donut */
.donut{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.donut svg{width:170px;height:170px;flex:none;margin:0 auto}
.donut .lg{min-width:0}
.donut .lg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 44px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.donut .lg div:last-child{border-bottom:0}
.donut .lg i{width:10px;height:10px;border-radius:3px}
.donut .lg b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.donut .lg em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* tables */
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tbar input[type=search]{border:1px solid #d5dae1;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;min-width:0;flex:1 1 180px;max-width:300px}
.tbar select{border:1px solid #d5dae1;border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:var(--card);max-width:220px;min-width:0}
.tbar .cnt{color:var(--muted);font-size:13px}
.tbar .ex{margin-left:auto;display:flex;gap:6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f7f8fa;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;cursor:pointer;user-select:none}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fafbfc}
tr.click{cursor:pointer}
.cellbtn{border:0;background:none;padding:2px 6px;margin:-2px -6px;border-radius:5px;color:var(--accent);cursor:pointer;font-variant-numeric:tabular-nums;text-decoration:underline;text-decoration-color:#b9d3ea;text-underline-offset:3px}
.cellbtn:hover{background:var(--accent-soft)}
.pager{display:flex;gap:12px;align-items:center;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);flex-wrap:wrap;background:#fbfbfc}
.pager label{display:inline-flex;gap:6px;align-items:center;margin-right:auto}
.pager select{border:1px solid #d5dae1;border-radius:6px;padding:3px 6px;font:inherit;font-size:13px}
.pager .btn.sm{padding:3px 10px;font-size:15px;line-height:1.2}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-idle{background:var(--idle-soft);color:var(--idle)}
.p-plum{background:var(--plum-soft);color:var(--plum)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* chart */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:11px var(--font)}
svg.chart .grid{stroke:#eceef2;stroke-width:1}
svg.chart rect.bar{cursor:pointer;transition:opacity .1s}
svg.chart g.col:hover rect.bar{opacity:.8}
svg.chart rect.hit{fill:transparent}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px}
/* Partners page */
.phead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.phead .ph-l{display:flex;gap:14px;align-items:flex-start;min-width:0}
.phead .ph-l .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.phead .ph-l .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.phead h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.ph-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph-r{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.ph-r select{min-width:220px;max-width:100%}
.pdir{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:#9cc3e6;box-shadow:0 4px 12px rgba(16,24,40,.08)}
.pc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc-h b{font-size:15px;line-height:1.3}
.pc-n{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc-n span{display:block;font-size:20px;font-weight:700}
.pc-n em{font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.pc-n small{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:7px 18px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.kvrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.kvrow:last-child{border-bottom:0}
/* CE Impact */
.ring{width:64px;height:64px;flex:none}
.ring text{font:700 13px var(--font);fill:var(--ink)}
.pcard2{display:flex;flex-direction:column;gap:12px}
.pc2-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pc2-n{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc2-n span{display:block;font-size:22px;font-weight:700}
.pc2-n small{color:var(--muted);font-size:12px}
.pc2-l>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.pc2-l>div:last-child{border-bottom:0}
.pbar{display:inline-block;width:70px;height:6px;border-radius:4px;background:var(--soft);margin-right:8px;vertical-align:middle;overflow:hidden}
.pbar i{display:block;height:100%}
.mini{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.mini .num{font-size:20px;font-weight:700}
tr.grp td{background:var(--soft);padding-top:10px}
tr.tot td{font-weight:600;border-top:1px solid #cfd5dd}
.note b{color:var(--ink)}
#tip{position:fixed;z-index:60;pointer-events:none;background:#1f2937;color:#fff;font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:260px}
#tip b{font-weight:600}
#tip .tr{display:flex;gap:10px;justify-content:space-between}
#tip .tr i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* drawer + popover + toast */
.scrim{position:fixed;inset:0;background:rgba(20,24,31,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(940px,100%);background:var(--card);z-index:41;overflow:auto;box-shadow:-8px 0 24px rgba(0,0,0,.12);
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.drawer h2{margin:0 0 4px;font-size:20px;padding-right:44px}
.drawer .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px}
.drawer .dsnap{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(max(14px,env(safe-area-inset-right,0px)) + 44px);display:flex;gap:6px}
.drawer .dsnap .btn{height:34px}
.drawer h2{padding-right:220px}
.drawer section{margin-top:20px;display:grid;gap:10px}
.drawer h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.drawer .kpi .val{font-size:24px}
.pop{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:14px 16px;width:min(360px,calc(100vw - 32px));font-size:14px}
.pop h5{margin:0 0 2px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pop.menu{width:220px;display:grid;gap:8px;padding:12px}
.pop.menu h5{margin-bottom:2px}
.pop.menu .btn{justify-content:flex-start}
.pop p{margin:0 0 10px}
.pop p:last-child{margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#1f2937;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.empty{padding:22px;text-align:center;color:var(--muted)}

@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);background:none}
  nav.side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:45;width:250px;transform:translateX(-102%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top,0px));border-right:1px solid var(--line)}
  nav.side.open{transform:none;box-shadow:8px 0 24px rgba(0,0,0,.15)}
  .menu-btn{display:inline-flex}

/* ---------- small renderers ---------- */
const KI = {
  forms:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  trend:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>',
  people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.3.2 4 1.7 4.6 4.5"/></svg>',
  partner:'<svg viewBox="0 0 24 24"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6M9 11h.01M15 11h.01"/></svg>',
  grant:'<svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2M4 12h16"/></svg>',
  rupee:'<svg viewBox="0 0 24 24"><path d="M7 5h10M7 9h10M10 5c3 0 5 1.5 5 4s-2 4-5 4H7l7 6"/></svg>',
  alert:'<svg viewBox="0 0 24 24"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
  check:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',

const sectionHead = (title, scope="") => `<div class="sec"><h2>${title}</h2>${scope ? `<span>${esc(scope)}</span>` : ""}</div>`;
const info = key => `<button class="info" data-info="${key}" aria-label="About this number">i</button>`;
function kpi({label, value, foot="", key="", progress=null, icon="forms", tone="", href=""}){
  const tg = href ? "a" : "div";
  return `<${tg} class="kpi" ${href ? `href="#${href}"` : ""}><span class="ic ${tone}">${KI[icon]}</span>${key ? info(key) : ""}<div class="lbl">${label}</div><div class="val num">${value}</div>${progress!==null ? `<div class="progress"><i style="width:${Math.min(100,progress)}%"></i></div>` : ""}${foot ? `<div class="foot">${foot}</div>` : ""}</${tg}>`;

const tipAttr = (title, lines) => `data-tip="${esc(JSON.stringify([title, lines]))}"`;
function barList(items, {max=null, fmtV=fmt, click=null}={}){
  if (!items.length) return `<div class="empty">Nothing in this selection.</div>`;

  }).join("") + `</div>`;

function legend(entries){ return `<div class="legend">` + entries.map(([l,c]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join("") + `</div>`; }
function donut(parts, centre, sub){
  const tot = parts.reduce((a,p) => a+p.v, 0); const r = 54, C = 2*Math.PI*r; let off = 0;
  const arcs = tot ? parts.filter(p => p.v).map(p => { const len = p.v/tot*C; const s = `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)" ${tipAttr(p.l, [["", fmt(p.v) + " (" + pct(p.v,tot) + "%)"]])}></circle>`; off += len; return s; }).join("") : "";

}
function niceMax(v){ if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
/* column chart: series [{label, tipTitle, value, segs?:[{v,c,t}]}]; every column carries a hover tooltip with its numbers */
function columnChart(series, {height=240, line=null, lineLabel="7-day average", partialLast=false, labelEvery=1, color="#5b9bd5"}={}){

    if (line && line[i] !== null && line[i] !== undefined) lines.push([lineLabel, fmt(line[i])]);
    if (last) lines.push(["", "Today so far, day not over"]);
    let col = "";
    if (s.segs){ let acc = 0; const vis = s.segs.filter(sg => sg.v); vis.forEach((sg, k) => { const top = k === vis.length-1; col += `<rect class="bar" x="${x}" y="${y(acc+sg.v)}" width="${w}" height="${Math.max(0,y(acc)-y(acc+sg.v))}" fill="${sg.c}" opacity="${last?.5:1}" ${top?`rx="${Math.min(3,w/3)}"`:""}/>`; acc += sg.v; }); }

  });

function table(id, cols, data, {search=true, rowClick=null, sort=null, dir=-1, pageSize=25, filters=[], name="iNOPS report", empty="Nothing in this selection."}={}){

function tableRows(id){

  if (t.sortK !== null){ const f = t.cols[t.sortK].v; d = [...d].sort((a,b) => { const x = f(a), y = f(b); return (x>y?1:x<y?-1:0) * t.dir; }); }

    d.map(r => `<tr class="${t.rowClick?"click":""}" ${t.rowClick?`data-rclick="${t.rowClick}" data-id="${esc(r._id ?? "")}"`:""}>${t.cols.map(c => c.noShow ? "" : `<td class="${c.r?"r":""}">${c.html ? c.html(r) : esc(c.v(r))}</td>`).join("")}</tr>`).join("") + `</tbody></table>` + pager;

    const canvas = await html2canvas(target, {scale:2, backgroundColor:"#ffffff", windowWidth:target.scrollWidth, height:target.scrollHeight, windowHeight:target.scrollHeight, scrollY:0, useCORS:true, ignoreElements: el => el.classList && ["tbar","pager","dsnap","x","info","filters"].some(c => el.classList.contains(c))});

function drill(title, sub, pred){

  const data = F.map((f,i) => { const u = D.users[f[F_U]]; return {_id:i, d:D.days[f[F_DAY]], form:D.forms[f[F_FORM]].form, pillar:D.forms[f[F_FORM]].pillar, p:pName(f[F_P]), un:u ? u.nm : "—", ue:u ? u.e : "", st:STATUS_TXT[f[F_ST]], ch:f[F_MOB] ? "Mobile app" : "Web", n:f[F_N]}; });

  const cols = [
    {h:"Date", v:r => r.d, html:r => `${dlabelY(r.d)} <span class="muted small">${dow(r.d)}</span>`, x:r => r.d},

function openDrill(btn){

  if (k === "pw"){ const p = +a, w = b; return drill(`${pName(p)} · week of ${dlabelY(w)}`, `${dlabel(w)} – ${dlabel(addDays(w,6))}`, f => f[F_P] === p && weekStart(D.days[f[F_DAY]]) === w && (!S.pillar || D.forms[f[F_FORM]].pillar === S.pillar)); }

  if (k === "p7"){ const p = +a, y = addDays(D.today,-1); return drill(`${pName(p)} · last 7 days`, `${dlabel(addDays(y,-6))} – ${dlabel(y)}`, f => f[F_P] === p && D.days[f[F_DAY]] >= addDays(y,-6) && D.days[f[F_DAY]] <= y); }

  if (k === "rv"){ const i = +a; return drill(`${D.forms[i].form} · waiting in Review`, scopeText(), f => f[F_FORM] === i && f[F_ST] === 1 && inScope(f) && (P === null || f[F_P] === P)); }
  if (k === "pf"){ const p = +a, i = +b; return drill(`${pName(p)} · ${D.forms[i].form}`, scopeText(), f => f[F_P] === p && f[F_FORM] === i && inScope(f)); }

}

function dailyChart(R, days){
  const [a,b] = range(); const t = D.today;
  const start = S.period === "all" ? addDays(t, -(days-1)) : (diffDays(a,b) > 90 ? addDays(b,-89) : a);
  const m = new Map(); R.forEach(f => { const d = D.days[f[F_DAY]]; const o = m.get(d) || {}; const p = D.forms[f[F_FORM]].pillar; o[p] = (o[p]||0) + f[F_N]; m.set(d, o); });
  const ds = []; for (let d = start; d <= b; d = addDays(d,1)) ds.push(d);
  const tot = d => Object.values(m.get(d)||{}).reduce((x,y) => x+y, 0);
  const series = ds.map(d => { const o = m.get(d)||{}; return {label:dlabel(d), tipTitle:`${dow(d)} ${dlabelY(d)}`, value:tot(d), segs:Object.keys(PILLAR_COL).map(p => ({v:o[p]||0, c:PILLAR_COL[p], t:p}))}; });
  const avg = ds.map((d,i) => i < 6 ? null : Math.round(ds.slice(i-6,i+1).reduce((s,x) => s + tot(x), 0)/7));
  if (b === t) avg[avg.length-1] = null;
  return legend([...Object.entries(PILLAR_COL), ["7-day average", "#e8821a"]]) + columnChart(series, {line:avg, partialLast:b===t, labelEvery:Math.ceil(series.length/12), height:250});
}

  const series = weeks.map(w => { const o = wk.get(w); const segs = Object.keys(PILLAR_COL).map(p => ({v:o[p]||0, c:PILLAR_COL[p], t:p})); return {label:dlabel(w), tipTitle:`Week of ${dlabelY(w)}`, value:segs.reduce((a,s) => a+s.v, 0), segs}; });

/* ---------- tooltip ---------- */
const tipEl = () => $("#tip");
function showTip(el, e){
  let d; try { d = JSON.parse(el.getAttribute("data-tip")); } catch(x){ return; }
  const [title, lines] = d; const t = tipEl();
  t.innerHTML = `<b>${esc(title)}</b>` + lines.map(([k,v,c]) => `<div class="tr"><span>${c ? `<i style="background:${c}"></i>` : ""}${esc(k)}</span><span>${esc(v)}</span></div>`).join("");
  t.hidden = false; moveTip(e);
}
function moveTip(e){ const t = tipEl(); if (t.hidden) return; const w = t.offsetWidth, h = t.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14; t.style.left = x + "px"; t.style.top = y + "px"; }
function hideTip(){ const t = tipEl(); if (t) t.hidden = true; }
let tipTarget = null;
function onPointer(e){
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el){ if (tipTarget){ tipTarget = null; hideTip(); } return; }
  if (el !== tipTarget || tipEl().hidden){ tipTarget = el; showTip(el, e); } else moveTip(e);
}
document.addEventListener("mouseover", onPointer);
document.addEventListener("mousemove", onPointer);
document.addEventListener("scroll", () => { tipTarget = null; hideTip(); }, true);

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;

  const cp = t.closest("[data-copy]"); if (cp){ e.stopPropagation(); return copyEmails(cp.dataset.copy); }
  const ex = t.closest("[data-export]"); if (ex){ e.stopPropagation(); return exportTable(ex.dataset.export, ex.dataset.fmt, ex); }
  const ddb = t.closest("[data-dd]"); if (ddb){ e.stopPropagation(); e.preventDefault(); return openDrill(ddb); }
  const ced = t.closest("[data-cedd]"); if (ced){ e.stopPropagation(); e.preventDefault(); return openCeDrill(ced); }
  const cea = t.closest("[data-ceapp]"); if (cea){ S.ceApp = cea.dataset.ceapp; saveS(); return render(); }
  if (t.closest("[data-close]")) return closeDrawer();
  if (t.closest("#snapBtn") || t.closest("[data-print]")) return printPage(t.closest("#snapBtn") || t.closest("[data-print]"));
  const sb = t.closest("[data-snap]"); if (sb){ e.stopPropagation(); if ($("#pop") && $("#pop").dataset.k === "snap") return closePop(); return snapshotMenu(sb); }
  const sf = t.closest("[data-snapfmt]"); if (sf) return snapshot(sf.dataset.snapfmt);

  if (t.id === "fClear"){ S.period="all"; S.partner=""; S.pillar=""; saveS(); return render(); }
  const pg = t.closest("[data-page]"); if (pg){ TABLES[pg.dataset.page].page += +pg.dataset.d; return rerenderTable(pg.dataset.page); }
  const th = t.closest("[data-sort]"); if (th){ const T = TABLES[th.dataset.sort], k = +th.dataset.k; if (T.sortK === k) T.dir *= -1; else { T.sortK = k; T.dir = -1; } T.page = 0; return rerenderTable(th.dataset.sort); }
  const rc = t.closest("[data-rclick]") || t.closest("[data-click]"); if (rc && !t.closest("a") && !t.closest("select") && !t.closest("input")){ const kind = rc.dataset.rclick || rc.dataset.click, id = rc.dataset.id; if (kind==="partner") partnerDrawer(id); else if (kind==="pform") openDrill({dataset:{dd:"pf", a:String(curP()), b:id}}); else if (kind==="form") formDrawer(id); else if (kind==="grant") grantDrawer(id); return; }
  if (t.closest("#menuBtn")) $("#side").classList.toggle("open");
});

  derive();
  const dt = D.pulled_at_ist;
  $("#asat").innerHTML = `Data as of <b>${esc(dlabelY(dt.slice(0,10)))}, ${esc(dt.slice(11,16))} IST</b>`;
  if (live){ const b = $("#refreshBtn"); b.hidden = false; b.onclick = () => location.reload(); }
  $("#openPortal").href = PORTAL;
  render();
}
function load(){
  const raw = document.getElementById("inops-data").textContent.trim();
  if (raw.startsWith("{")) return start(JSON.parse(raw), false);
  fetch(LIVE_ENDPOINT, {credentials:"same-origin", headers:{Accept:"application/json"}})
    .then(r => { if (!r.ok) throw new Error(r.status === 403 ? "You do not have access to this dashboard. Ask the iNOPS admin to add the dashboard role to your account." : "The iNOPS server returned " + r.status + "."); return r.json(); })
    .then(j => start(j.message, true))
    .catch(err => { $("#view").innerHTML = `<div class="card"><b>Could not load iNOPS data.</b><p class="muted">${esc(err.message)}</p></div>`; });
}
load();
})();
</script>
